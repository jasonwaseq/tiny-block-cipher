# Tiny Tapeout project information
project:
  title:        "Tiny Lightweight Block Cipher"      # Project title
  author:       "Jason Waseq"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "64-bit lightweight sequential block cipher core with 80-bit key and deterministic FSM timing"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "load plaintext byte"
  ui[1]: "load key byte"
  ui[2]: "start pulse"
  ui[3]: "byte index bit 0"
  ui[4]: "byte index bit 1"
  ui[5]: "byte index bit 2"
  ui[6]: "byte index bit 3"
  ui[7]: "unused"

  # Outputs
  uo[0]: "ciphertext byte bit 0"
  uo[1]: "ciphertext byte bit 1"
  uo[2]: "ciphertext byte bit 2"
  uo[3]: "ciphertext byte bit 3"
  uo[4]: "ciphertext byte bit 4"
  uo[5]: "ciphertext byte bit 5"
  uo[6]: "ciphertext byte bit 6"
  uo[7]: "ciphertext byte bit 7"

  # Bidirectional pins
  uio[0]: "done flag (output)"
  uio[1]: "input byte bit 1"
  uio[2]: "input byte bit 2"
  uio[3]: "input byte bit 3"
  uio[4]: "input byte bit 4"
  uio[5]: "input byte bit 5"
  uio[6]: "input byte bit 6"
  uio[7]: "input byte bit 7"

# Do not change!
yaml_version: 6
